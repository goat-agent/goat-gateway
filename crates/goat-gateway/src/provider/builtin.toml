[provider.anthropic]
label = "Anthropic"
key = "x_api_key"
limits = "headers"
endpoints = [{ wire = "messages", url = "https://api.anthropic.com/v1/messages" }]
headers = { "anthropic-version" = "2023-06-01" }
carried = [
  { header = "authorization", starts_with = "Bearer sk-ant-oat", hosts = ["api.anthropic.com"] },
  { header = "authorization", starts_with = "Bearer sk-ant-api", hosts = ["api.anthropic.com"] },
  { header = "x-api-key", starts_with = "sk-ant-api", hosts = ["api.anthropic.com"] },
]

[[provider.anthropic.refusals]]
status = 400
says = "Third-party apps now draw from your extra usage"
credential = "oauth"
demote_minutes = 1440

[[provider.anthropic.refusals]]
