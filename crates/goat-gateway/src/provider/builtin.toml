[provider.openai]
label = "OpenAI"
limits = "headers"
endpoints = [
  { wire = "responses", url = "https://api.openai.com/v1/responses" },
  { wire = "chat", url = "https://api.openai.com/v1/chat/completions" },
]
carried = [{ header = "authorization", starts_with = "Bearer sk-", hosts = ["api.openai.com"] }]

[[provider.openai.models]]
name = "gpt-5"

[[provider.openai.models]]
name = "gpt-5-codex"

[provider.chatgpt]
label = "ChatGPT via Codex"
limits = "headers"
api_key = false
carried = [
  { header = "authorization", starts_with = "Bearer ", alongside = "chatgpt-account-id", hosts = ["chatgpt.com"] },
]

[[provider.chatgpt.endpoints]]
wire = "responses"
url = "https://chatgpt.com/backend-api/codex/responses"
refuses = ["max_output_tokens", "temperature", "top_p"]

[provider.chatgpt.endpoints.knock]
instructions = "Reply with one word."
input = [{ type = "message", role = "user", content = [{ type = "input_text", text = "." }] }]
stream = true
store = false

[provider.chatgpt.sign_in]
label = "ChatGPT Plus/Pro, through Codex"
client_id = "app_EMoamEEZ73f0CkXaXp7hrann"
authorize_url = "https://auth.openai.com/oauth/authorize"
token_url = "https://auth.openai.com/oauth/token"
scopes = "openid profile email offline_access"
body = "form"
refresh_body = "json"
extra = { id_token_add_organizations = "true", codex_cli_simplified_flow = "true" }
loopback = { host = "127.0.0.1", port = 1455, fallback_port = 1457, path = "/auth/callback" }
device = { user_code_url = "https://auth.openai.com/api/accounts/deviceauth/usercode", poll_url = "https://auth.openai.com/api/accounts/deviceauth/token", verification_url = "https://auth.openai.com/codex/device", redirect_uri = "https://auth.openai.com/deviceauth/callback" }
identity = { claims = [["chatgpt_account_id"], ["https://api.openai.com/auth", "chatgpt_account_id"]], header = "chatgpt-account-id" }

[[provider.chatgpt.models]]
name = "gpt-5"

[[provider.chatgpt.models]]
name = "gpt-5-codex"

[provider.chatgpt_signin]
label = "ChatGPT"
limits = "headers"
api_key = false
check = "https://api.openai.com/v1/models"

[[provider.chatgpt_signin.endpoints]]
wire = "responses"
url = "https://api.openai.com/v1/responses"

[provider.chatgpt_signin.sign_in]
label = "Sign in with ChatGPT"
client_id = "dynamic_agent_client"
issues_client = true
authorize_url = "https://auth.openai.com/api/accounts/authorize"
token_url = "https://auth.openai.com/api/accounts/oauth/token"
scopes = "openid profile email offline_access resource.invoke chatgpt.tokens.use.direct"
must_grant = ["chatgpt.tokens.use.direct"]
body = "form"
extra = { resource = "https://api.openai.com/v1", ext_agent_host_id = "{install}", agent_name_hint = "goat gateway", nonce = "{nonce}" }
first_only = ["agent_name_hint"]
token_extra = { resource = "https://api.openai.com/v1" }
loopback = { host = "127.0.0.1", port = 1455, fallback_port = 1457, path = "/auth/callback" }

