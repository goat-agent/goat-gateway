[provider.anthropic]
label = "Anthropic"
key = "x_api_key"
limits = "headers"
endpoints = [{ wire = "messages", url = "https://api.anthropic.com/v1/messages" }]
headers = { "anthropic-version" = "2023-06-01" }

[[provider.anthropic.models]]
name = "claude-opus-5"
limit_scope = "opus"
thinking = "adaptive"
max_tokens = 32000
cache_min_tokens = 1024
mid_conversation_system = true
price = { input = 15000000, output = 75000000, cache_read = 1500000, cache_write = 18750000 }

[[provider.anthropic.models]]
name = "claude-sonnet-5"
limit_scope = "sonnet"
thinking = "adaptive"
max_tokens = 32000
cache_min_tokens = 1024
mid_conversation_system = false
price = { input = 3000000, output = 15000000, cache_read = 300000, cache_write = 3750000 }

[[provider.anthropic.models]]
name = "claude-fable-5"
limit_scope = "fable"
thinking = "adaptive"
max_tokens = 32000
cache_min_tokens = 1024
mid_conversation_system = true

[[provider.anthropic.models]]
name = "claude-opus-4-8"
limit_scope = "opus"
thinking = "adaptive"
max_tokens = 32000
cache_min_tokens = 1024
mid_conversation_system = true

[[provider.anthropic.models]]
name = "claude-haiku-4-5"
thinking = "budget"
max_tokens = 8192
cache_min_tokens = 2048
mid_conversation_system = false
price = { input = 1000000, output = 5000000, cache_read = 100000, cache_write = 1250000 }

[provider.openai]
label = "OpenAI"
limits = "headers"
endpoints = [
  { wire = "responses", url = "https://api.openai.com/v1/responses" },
  { wire = "chat", url = "https://api.openai.com/v1/chat/completions" },
]

[[provider.openai.models]]
name = "gpt-5"

[[provider.openai.models]]
name = "gpt-5-codex"

[provider.zai]
label = "Z.ai GLM Coding Plan"
limits = { endpoint = { url = "https://api.z.ai/api/monitor/usage/quota/limit" } }
endpoints = [{ wire = "messages", url = "https://api.z.ai/api/anthropic/v1/messages" }]
headers = { "anthropic-version" = "2023-06-01" }

[[provider.zai.models]]
name = "glm-4.7"

[[provider.zai.models]]
name = "glm-4.6"

[[provider.zai.models]]
name = "glm-4.5-air"

[provider.kimi]
label = "Kimi Coding Plan"
limits = { endpoint = { url = "https://api.kimi.com/coding/v1/usages" } }
endpoints = [{ wire = "chat", url = "https://api.kimi.com/coding/v1/chat/completions" }]

[[provider.kimi.models]]
name = "kimi-for-coding"

[provider.moonshot]
label = "Moonshot"
endpoints = [
  { wire = "messages", url = "https://api.moonshot.ai/anthropic/v1/messages" },
  { wire = "chat", url = "https://api.moonshot.ai/v1/chat/completions" },
]
headers = { "anthropic-version" = "2023-06-01" }

[[provider.moonshot.models]]
name = "kimi-k2.7-code"
